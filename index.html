<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena dos Clubes — Estatísticas</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07101a;color:#eef5fc;font-family:Inter,system-ui,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.hero,.card{background:#0d1825;border:1px solid #263a50;border-radius:18px;padding:18px;margin-bottom:14px}h1{margin:6px 0;color:#f6c445}.muted{color:#9fb2c8}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:#142236;color:#fff;border:1px solid #36516d;border-radius:10px;padding:9px 12px;cursor:pointer}.tabs button.active{background:#2a3e57;border-color:#6f96bf}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.k{background:#09131f;border:1px solid #203449;border-radius:14px;padding:12px}.k b{display:block;font-size:28px;margin-top:4px}select{width:100%;background:#09131f;color:#fff;border:1px solid #36516d;border-radius:10px;padding:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tablewrap{overflow:auto;border:1px solid #203449;border-radius:14px}table{width:100%;border-collapse:collapse;min-width:620px}td,th{padding:9px;border-bottom:1px solid #1d2c3c;text-align:left}th{color:#f6c445;position:sticky;top:0;background:#0d1825}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#15273b;color:#bcd0e6;font-size:12px;font-weight:800}.ranknote{font-size:12px;color:#9fb2c8;margin:-6px 0 8px}.best,.pa{color:#f6c445;font-weight:900}.up{color:#39d98a;font-weight:950}.down{color:#ff6673;font-weight:950}.flat{color:#9fb2c8;font-weight:800}.audit{padding:12px 14px;border-radius:12px;margin:8px 0 12px}.audit.ok{background:#0d2a20;border:1px solid #2f7a58;color:#c8f5dc}.audit.bad{background:#321a1d;border:1px solid #94434b;color:#ffd5d9}.chart{width:100%;max-width:780px;height:auto;background:#09131f;border:1px solid #203449;border-radius:14px;padding:8px;margin-top:8px}@media(max-width:650px){.row{grid-template-columns:1fr}.wrap{padding:10px}.hero,.card{padding:14px}.k b{font-size:23px}}
</style>
</head>
<body><div class="wrap">
<div class="hero"><span class="pill">ARENA DOS CLUBES</span><h1>Estatísticas Oficiais</h1><div class="muted" id="updated">Carregando dados...</div></div>
<div class="card"><div class="tabs"><button class="active" data-view="geral">🏁 Tabela Geral</button><button data-view="clube">🔎 Clube</button><button data-view="confronto">⚔️ Confronto</button><button data-view="rank">🏆 Rankings</button><button data-view="hist">📚 Batalhas</button></div>
<section id="geral"><div id="pointsAudit"></div><div class="ranknote"><b>Pontos Arena:</b> 1º 300 • 2º 275 • 3º 250 • Top 10 destacado • queda progressiva até 200º = 1 • cada kill = +5 PA.</div><div id="generalTable"></div></section>
<section id="clube" hidden><select id="clubSel"></select><div id="clubCard" style="margin-top:12px"></div></section>
<section id="confronto" hidden><div class="row"><select id="aSel"></select><select id="bSel"></select></div><div id="hCard" style="margin-top:12px"></div></section>
<section id="rank" hidden><div class="row"><div><h3>🏆 Top títulos</h3><div class="ranknote">Desempate: kills.</div><div id="rWins"></div></div><div><h3>💀 Top kills</h3><div id="rKills"></div></div></div></section>
<section id="hist" hidden><h3>Últimas batalhas</h3><div id="histTable"></div></section></div></div>
<script>
let D=null,clubs=[],stats={},h2h={},log=[];const KILL=5,TOP10=[0,300,275,250,240,232,225,218,212,206,200];
const byId=id=>clubs.find(c=>c.id===id),cnt=(a,b)=>Number(h2h[a+'>'+b]||0),st=c=>stats[c.id]||{battles:0,wins:0,seconds:0,thirds:0,kills:0,bestKills:0};
function pp(p){p=Number(p);if(p<1||p>200)return 0;if(p<=10)return TOP10[p];return Math.max(1,Math.round(200-((p-10)*199/190)))}
function hid(h,role){let d=h?.[role+'Id'];if(d&&byId(d))return d;let name=h?.[role],uf=h?.[role+'State'];return (clubs.find(c=>c.name===name&&(!uf||c.state===uf))||clubs.find(c=>c.display===name))?.id||null}
function belims(h){let m=new Map(),bn=Number(h.battleNo);for(let e of (h.eliminations||[]))if(e?.victimId&&!m.has(e.victimId))m.set(e.victimId,{killerId:e.killerId,victimId:e.victimId,place:Number(e.place)});for(let e of log)if(Number(e.battleNo)===bn&&e?.victimId&&!m.has(e.victimId))m.set(e.victimId,{killerId:e.killerId,victimId:e.victimId,place:Number(e.place)});return [...m.values()]}
function rebuild(h){let el=belims(h),pl=new Map(),ki={},ch=hid(h,'champion');if(ch)pl.set(ch,1);for(let e of el){if(!byId(e.victimId))continue;let p=Number(e.place);if(Number.isInteger(p)&&p>=2&&p<=200)pl.set(e.victimId,p);if(e.killerId&&byId(e.killerId))ki[e.killerId]=(ki[e.killerId]||0)+1}for(let [r,p] of [['second',2],['third',3]]){let id=hid(h,r);if(id&&!pl.has(id))pl.set(id,p)}let owners=new Map(),collision=false;for(let [id,p] of pl){if(owners.has(p)&&owners.get(p)!==id)collision=true;else owners.set(p,id)}let missing=0;for(let p=1;p<=200;p++)if(!owners.has(p))missing++;let uv=new Set(el.map(e=>e.victimId).filter(Boolean));let valid=!!ch&&!collision&&pl.size===200&&!missing&&uv.size===199;return {battleNo:Number(h.battleNo),pl,ki,valid,reason:valid?'':`${missing} posições ausentes • ${uv.size}/199 eliminações`}}
function calc(){if(D.arenaPoints?.standings?.length===200)return D.arenaPoints;let bs=(D.history||[]).slice().sort((a,b)=>a.battleNo-b.battleNo).map(rebuild),ok=bs.filter(b=>b.valid),bad=bs.filter(b=>!b.valid),a={};for(let c of clubs)a[c.id]={clubId:c.id,points:0,kills:0,titles:0,podiums:0,bestPlace:201,rank:null,movement:0,lastBattlePoints:0,bestRank:null,worstRank:null,biggestRise:0,biggestFall:0,history:[]};let prev=null;for(let b of ok){for(let c of clubs){let r=a[c.id],p=b.pl.get(c.id),k=b.ki[c.id]||0,e=pp(p)+k*KILL;r.points+=e;r.kills+=k;r.lastBattlePoints=e;r.bestPlace=Math.min(r.bestPlace,p);if(p===1)r.titles++;if(p<=3)r.podiums++;r._p=p;r._k=k}let order=clubs.map(c=>a[c.id]).sort((x,y)=>y.points-x.points||y.titles-x.titles||y.podiums-x.podiums||y.kills-x.kills||x.bestPlace-y.bestPlace||byId(x.clubId).display.localeCompare(byId(y.clubId).display,'pt-BR')),cur={};order.forEach((r,i)=>{let rank=i+1,m=prev?(prev[r.clubId]-rank):0;cur[r.clubId]=rank;r.rank=rank;r.movement=m;r.bestRank=r.bestRank==null?rank:Math.min(r.bestRank,rank);r.worstRank=r.worstRank==null?rank:Math.max(r.worstRank,rank);if(m>r.biggestRise)r.biggestRise=m;if(m<0)r.biggestFall=Math.max(r.biggestFall,Math.abs(m));r.history.push({battleNo:b.battleNo,rank,movement:m,pointsEarned:r.lastBattlePoints,place:r._p,kills:r._k,totalPoints:r.points})});prev=cur}return {version:'PA-1.0',killPoints:5,validBattles:ok.map(b=>b.battleNo),invalidBattles:bad.map(b=>({battleNo:b.battleNo,reason:b.reason})),standings:clubs.map(c=>a[c.id]).sort((x,y)=>(x.rank||999)-(y.rank||999))}}
let PA=null;function mov(n){n=Number(n)||0;return n>0?`<span class="up">▲${n}</span>`:n<0?`<span class="down">▼${Math.abs(n)}</span>`:'<span class="flat">—</span>'}
function nem(cid){let x=clubs.filter(c=>c.id!==cid).map(c=>({c,n:cnt(c.id,cid)})).sort((a,b)=>b.n-a.n);return x[0]?.n?x[0]:null}function fav(cid){let x=clubs.filter(c=>c.id!==cid).map(c=>({c,n:cnt(cid,c.id)})).sort((a,b)=>b.n-a.n);return x[0]?.n?x[0]:null}
function best(cid){const c=byId(cid);let bp=null,bn=null;for(const h of (D.history||[])){let p=null;if(h.championId===cid)p=1;else if(h.secondId===cid)p=2;else if(h.thirdId===cid)p=3;else if(Array.isArray(h.eliminations)){const e=h.eliminations.find(x=>x.victimId===cid&&Number.isFinite(Number(x.place)));if(e)p=Number(e.place)}if(p==null&&c){if(h.champion===c.name&&(!h.championState||h.championState===c.state))p=1;else if(h.second===c.name&&(!h.secondState||h.secondState===c.state))p=2;else if(h.third===c.name&&(!h.thirdState||h.thirdState===c.state))p=3}if(p!=null&&(bp==null||p<bp||(p===bp&&Number(h.battleNo)<Number(bn)))){bp=p;bn=Number(h.battleNo)}}return {place:bp,battleNo:bn}}
function chart(h){if(!h?.length)return '<div class="muted">Sem histórico suficiente.</div>';let W=720,H=190,P=28,n=h.length,pts=h.map((d,i)=>({x:n===1?W/2:P+i*(W-2*P)/(n-1),y:P+(Math.max(1,Math.min(200,d.rank))-1)*(H-2*P)/199,d})),poly=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' '),dots=pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#f6c445"><title>#${p.d.battleNo}: ${p.d.rank}º • ${p.d.totalPoints} PA</title></circle>`).join('');return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${P}" y1="${P}" x2="${W-P}" y2="${P}" stroke="#294158"/><line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#294158"/><text x="4" y="${P+5}" fill="#9fb2c8" font-size="12">1º</text><text x="0" y="${H-P+5}" fill="#9fb2c8" font-size="12">200º</text><polyline fill="none" stroke="#f6c445" stroke-width="3" points="${poly}"/>${dots}<text x="${P}" y="${H-5}" fill="#9fb2c8" font-size="11">#${h[0].battleNo}</text><text x="${W-P-28}" y="${H-5}" fill="#9fb2c8" font-size="11">#${h[h.length-1].battleNo}</text></svg>`}
function general(){let bad=PA.invalidBattles||[],ok=PA.validBattles||[];pointsAudit.innerHTML=bad.length?`<div class="audit bad">⚠ ${ok.length} batalhas válidas. ${bad.map(x=>'#'+x.battleNo+': '+x.reason).join(' | ')}</div>`:`<div class="audit ok">✅ ${ok.length} batalhas contabilizadas • ${clubs.length} clubes classificados.</div>`;generalTable.innerHTML='<div class="tablewrap"><table><tr><th>#</th><th>↕</th><th>Clube</th><th>PA</th><th>Última</th><th>🏆</th><th>💀</th><th>Melhor rank</th></tr>'+PA.standings.map(r=>`<tr><td><b>${r.rank||'—'}º</b></td><td>${mov(r.movement)}</td><td>${byId(r.clubId)?.display||r.clubId}</td><td class="pa">${r.points}</td><td>+${r.lastBattlePoints}</td><td>${r.titles}</td><td>${r.kills}</td><td>${r.bestRank?`${r.bestRank}º`:'—'}</td></tr>`).join('')+'</table></div>'}
function opts(){return clubs.slice().sort((a,b)=>a.display.localeCompare(b.display,'pt-BR')).map(c=>`<option value="${c.id}">${c.display}</option>`).join('')}
function club(){const c=byId(clubSel.value);if(!c)return;const s=st(c),n=nem(c.id),f=fav(c.id),b=best(c.id),p=PA.standings.find(x=>x.clubId===c.id);clubCard.innerHTML=`<h2>${c.display}</h2><div class="grid"><div class="k">Ranking Geral<b>${p?.rank?`${p.rank}º ${mov(p.movement)}`:'—'}</b></div><div class="k">Pontos Arena<b class="pa">${p?.points||0} PA</b></div><div class="k">Títulos<b>${s.wins}</b></div><div class="k">Kills<b>${s.kills}</b></div></div><p>🎯 Última batalha: <b>+${p?.lastBattlePoints||0} PA</b></p><p>📊 Melhor ranking geral: <b>${p?.bestRank?p.bestRank+'º':'—'}</b> • 🚀 maior subida: <b>${p?.biggestRise?'▲'+p.biggestRise:'—'}</b> • 📉 maior queda: <b>${p?.biggestFall?'▼'+p.biggestFall:'—'}</b></p><p>🥈 Vices: <b>${s.seconds}</b> • 🥉 Terceiros: <b>${s.thirds}</b> • 🔥 Recorde de kills: <b>${s.bestKills}</b></p><p>📈 Melhor posição em batalha: <b class="best">${b.place==null?'—':b.place+'º lugar'}</b> • 📅 ${b.battleNo==null?'—':'Batalha #'+b.battleNo}</p><p>💀 Carrasco: <b>${n?n.c.display+' ('+n.n+'x)':'—'}</b> • 🎯 Vítima favorita: <b>${f?f.c.display+' ('+f.n+'x)':'—'}</b></p><h3>📈 Evolução no ranking</h3>${chart(p?.history||[])}`}
function head(){let a=byId(aSel.value),b=byId(bSel.value);if(!a||!b)return;if(a.id===b.id){hCard.innerHTML='Escolha clubes diferentes.';return}let ab=cnt(a.id,b.id),ba=cnt(b.id,a.id),last=log.find(e=>(e.killerId===a.id&&e.victimId===b.id)||(e.killerId===b.id&&e.victimId===a.id));hCard.innerHTML=`<h2>${a.display} × ${b.display}</h2><div class="grid"><div class="k">${a.display} eliminou<b>${ab}</b></div><div class="k">${b.display} eliminou<b>${ba}</b></div><div class="k">Total direto<b>${ab+ba}</b></div></div><p>Último confronto: <b>${last?`Batalha #${last.battleNo}: ${byId(last.killerId)?.display||last.killerId} eliminou ${byId(last.victimId)?.display||last.victimId}`:'—'}</b></p>`}
function tbl(arr,val){return '<div class="tablewrap"><table>'+arr.map((x,i)=>`<tr><td>${i+1}. ${x.c.display}</td><td><b>${val(x.s)}</b></td></tr>`).join('')+'</table></div>'}function ranks(){let a=clubs.map(c=>({c,s:st(c)}));rWins.innerHTML=tbl(a.slice().sort((x,y)=>y.s.wins-x.s.wins||y.s.kills-x.s.kills).slice(0,20),s=>s.wins+' 🏆 • '+s.kills+' 💀');rKills.innerHTML=tbl(a.slice().sort((x,y)=>y.s.kills-x.s.kills||y.s.wins-x.s.wins).slice(0,20),s=>s.kills+' 💀')}
function hist(){if(!(D.history||[]).length){histTable.innerHTML='<p class="muted">A primeira batalha oficial ainda não foi registrada.</p>';return}histTable.innerHTML='<div class="tablewrap"><table><tr><th>#</th><th>Campeão</th><th>Vice</th><th>3º</th><th>Top Killer</th></tr>'+D.history.slice(0,50).map(h=>`<tr><td>${h.battleNo}</td><td>${h.champion||'—'}-${h.championState||''}</td><td>${h.second||'—'}-${h.secondState||''}</td><td>${h.third||'—'}-${h.thirdState||''}</td><td>${h.topKiller||'—'} (${h.topKillerKills||0})</td></tr>`).join('')+'</table></div>'}
function show(id){['geral','clube','confronto','rank','hist'].forEach(x=>document.getElementById(x).hidden=x!==id);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id))}
async function load(){const r=await fetch('dados.json?ts='+Date.now(),{cache:'no-store'});D=await r.json();clubs=D.clubs||[];stats=D.stats||{};h2h=D.h2h||{};log=D.eliminationLog||[];PA=calc();updated.textContent=`Batalha atual: #${D.battleNo||0} • atualizado em ${D.generatedAt?new Date(D.generatedAt).toLocaleString('pt-BR'):'aguardando atualização'} • Pontos Arena ${PA.version||'PA-1.0'}`;clubSel.innerHTML=aSel.innerHTML=bSel.innerHTML=opts();if(bSel.options.length>1)bSel.selectedIndex=1;clubSel.onchange=club;aSel.onchange=head;bSel.onchange=head;general();club();head();ranks();hist()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));load().catch(err=>{updated.textContent='Não foi possível carregar os dados. Atualize a página.';console.error(err)});
</script></body></html>
