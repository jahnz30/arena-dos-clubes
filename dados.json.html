const clubs=D.clubs, stats=D.stats||{}, h2h=D.h2h||{}, log=D.eliminationLog||[];

function st(c){return stats[c.id]||{battles:0,wins:0,seconds:0,thirds:0,kills:0,bestKills:0}}
function nem(cid){let x=clubs.filter(c=>c.id!==cid).map(c=>({c,n:cnt(c.id,cid)})).sort((a,b)=>b.n-a.n);return x[0]?.n?x[0]:null}
function fav(cid){let x=clubs.filter(c=>c.id!==cid).map(c=>({c,n:cnt(cid,c.id)})).sort((a,b)=>b.n-a.n);return x[0]?.n?x[0]:null}
function opts(){return clubs.slice().sort((a,b)=>a.display.localeCompare(b.display,'pt-BR')).map(c=>'<option value="'+c.id+'">'+c.display+'</option>').join('')}

function club(){let c=byId(clubSel.value),s=st(c),n=nem(c.id),f=fav(c.id);clubCard.innerHTML='<h2>'+c.display+'</h2><div class="grid"><div class="k">Batalhas<b>'+s.battles+'</b></div><div class="k">Títulos<b>'+s.wins+'</b></div><div class="k">Kills<b>'+s.kills+'</b></div><div class="k">Pódios<b>'+(s.wins+s.seconds+s.thirds)+'</b></div></div><p>💀 Carrasco: <b>'+(n?n.c.display+' ('+n.n+'x)':'—')+'</b></p><p>🎯 Vítima favorita: <b>'+(f?f.c.display+' ('+f.n+'x)':'—')+'</b></p>'}

function ranks(){let a=clubs.map(c=>({c,s:st(c)}));rWins.innerHTML=tbl(a.slice().sort((x,y)=>y.s.wins-x.s.wins||y.s.kills-x.s.kills).slice(0,20),s=>s.wins+' 🏆');rKills.innerHTML=tbl(a.slice().sort((x,y)=>y.s.kills-x.s.kills||y.s.wins-x.s.wins).slice(0,20),s=>s.kills+' ⚔️')}
function hist(){histTable.innerHTML='<table><tr><th>#</th><th>Campeão</th><th>Vice</th><th>Top Killer</th></tr>'+D.history.slice(0,50).map(h=>'<tr><td>'+h.battleNo+'</td><td>'+h.champion+'-'+(h.championState||'')+'</td><td>'+(h.second||'—')+'-'+(h.secondState||'')+'</td><td>'+(h.topKiller||'—')+' ('+(h.topKillerKills||0)+')</td></tr>').join('')+'</table>'}
